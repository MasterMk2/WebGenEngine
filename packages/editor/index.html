<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WebGenEngine エディタ（試作）</title>
<link rel="stylesheet" href="editor.css">
</head>
<body>
<header class="toolbar">
  <strong class="brand">WebGenEngine</strong>
  <a id="posts-link" class="link posts-link" href="posts.html" hidden>記事の一覧</a>
  <span class="page-name" id="page-name">トップページ</span>
  <div class="page-meta" id="page-meta" hidden>
    <label class="sr-only" for="page-title">題名</label>
    <input id="page-title" maxlength="120" autocomplete="off" title="題名（一覧とブラウザのタブに出ます）">
    <label class="sr-only" for="page-date">日付</label>
    <input id="page-date" type="date" title="記事の日付（一覧はこの順に並びます）">
    <label class="sr-only" for="page-path">書き出し先</label>
    <input id="page-path" maxlength="200" autocomplete="off" spellcheck="false" hidden title="書き出し先（サイトの中の場所）。変えると、次に公開したときに移ります">
    <span class="page-path-note" id="page-path-note" hidden></span>
    <button type="button" id="page-description-open" popovertarget="page-description-pop" title="検索結果や SNS で題名の下に出る文">説明文</button>
    <div popover id="page-description-pop" class="description-pop">
      <label for="page-description">説明文</label>
      <textarea id="page-description" rows="4" maxlength="300" placeholder="記事の内容を 1〜2 文で。検索結果や SNS で題名の下に出ます"></textarea>
      <p class="description-count" id="page-description-count" aria-live="polite"></p>
    </div>
  </div>
  <div class="group" role="group" aria-label="操作の履歴">
    <button type="button" id="undo" title="元に戻す (Ctrl+Z)">元に戻す</button>
    <button type="button" id="redo" title="やり直す (Ctrl+Y)">やり直す</button>
  </div>
  <div class="group" role="group" aria-label="プレビューの幅">
    <button type="button" id="width-pc" aria-pressed="true">PC</button>
    <button type="button" id="width-sp" aria-pressed="false">スマホ</button>
  </div>
  <span class="save-state" id="save-state" role="status" aria-live="polite"></span>
  <div class="group end">
    <a id="view-site" class="link" href="../site/" target="_blank" rel="noopener" hidden>サイトを見る</a>
    <button type="button" id="history-toggle" aria-pressed="false" aria-controls="history">履歴</button>
    <button type="button" id="source-toggle" aria-pressed="false" title="ソースを出す・隠す (Ctrl+/)">ソース</button>
    <button type="button" id="publish" class="primary">公開</button>
  </div>
</header>
<main class="workspace no-source" id="workspace">
  <section class="preview-pane" aria-label="プレビュー">
    <div class="preview-frame" id="frame-wrap">
      <iframe id="preview" title="プレビュー" sandbox="allow-same-origin"></iframe>
      <div class="overlay" id="overlay" aria-hidden="true"></div>
      <div class="blockbar" id="blockbar" role="toolbar" aria-label="選んだ部品の操作" hidden></div>
      <button type="button" class="insert-point" id="insert-point" title="ここに部品を足す" aria-label="ここに部品を足す" hidden>＋</button>
      <div class="insert-menu" id="insert-menu" role="menu" aria-label="足す部品" hidden></div>
      <div class="link-box" id="link-box" role="dialog" aria-label="リンク" hidden></div>
    </div>
  </section>
  <aside class="side">
    <section class="history" id="history" aria-label="履歴" hidden></section>
    <section class="props" id="props" aria-label="選んだ部品"></section>
    <section class="source-pane" aria-label="ソース">
      <div class="pane-head">
        <span>ソース</span>
        <span id="diff" class="diff"></span>
      </div>
      <div class="code">
        <pre class="backdrop" id="backdrop" aria-hidden="true"></pre>
        <textarea id="source" spellcheck="false" wrap="off" aria-label="ページのソース"></textarea>
      </div>
    </section>
  </aside>
</main>
<footer class="statusbar">
  <span class="status" id="status" role="status" aria-live="polite"></span>
  <span class="status-actions" id="status-actions"></span>
  <button type="button" id="reset" class="quiet" title="サンプルに戻す（開発用）">サンプルに戻す</button>
</footer>
<script type="module" src="editor.mjs"></script>
</body>
</html>
